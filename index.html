  .list { display: flex; flex-direction: column; gap: 8px; }

    padding: 2px 10px 4px;

  .sum { margin-left: auto; color: #6b6b76; font-size: 13px; font-weight: 400; white-space: nowrap; }

  .item .l2 { font-weight: 600; }
  .item .tag { color: #6b6b76; font-size: 13px; white-space: nowrap; }
  .desc { color: #5c5c66; font-size: 13px; }
  .foot { margin-top: 16px; color: #8a8a94; font-size: 13px; }
</style>

let view = "全部";
let fold = "closed";

function summary(items) {
  const call = items.filter(i => i.tag === "4S调用").length;
  const skip = items.length - call;
  if (call === 0) return "整组不调用";
  if (skip === 0) return "整组调用";
  return "调用 " + call + " · 不调用 " + skip;
}

function groupsOf() {
  const visible = view === "全部" ? ITEMS : ITEMS.filter(i => i.tag === view);
  const groups = [];
  for (const item of visible) {
    const last = groups[groups.length - 1];
    if (last && last.l1 === item.l1) last.items.push(item);
    else groups.push({ l1: item.l1, items: [item] });
  }
  return groups;
}

function renderTools() {
  const specs = [
    ["全部", "4S业务", "view"],
    ["4S调用", "只看调用", "view"],
    ["4S不调用", "只看不调用", "view"],
    ["closed", "全部收起", "fold"],
    ["call", "展开要调用的", "fold"],
    ["all", "全部展开", "fold"],
  ];
  document.getElementById("tools").innerHTML = specs.map(([value, label, kind]) => {
    const on = (kind === "view" ? view : fold) === value;
    return '<button class="' + (on ? "on" : "") + '" data-kind="' + kind + '" data-value="' + value + '">' + label + '</button>';
  }).join("");
}

function render() {
  document.getElementById("n-call").textContent = ITEMS.filter(i => i.tag === "4S调用").length;
  document.getElementById("n-skip").textContent = ITEMS.filter(i => i.tag === "4S不调用").length;
  renderTools();
  const list = document.getElementById("list");
  list.innerHTML = "";
  for (const group of groupsOf()) {
    const call = group.items.some(i => i.tag === "4S调用");
    const open = fold === "all" || (fold === "call" && call);
    const mod = document.createElement("section");
    mod.className = "mod" + (call ? " has-call" : "") + (open ? " open" : "");
    const rows = group.items.map(item => {
      const called = item.tag === "4S调用";
      return '<div class="item"><div class="top"><div class="l2">' + item.l2 + '</div><div class="tag">' + (called ? "调用" : "不调用") + '</div></div><div class="desc">' + item.desc + '</div></div>';
    }).join("");
    mod.innerHTML =
      '<button class="head" type="button"><span class="chev">' + (open ? "▾" : "▸") + '</span><span class="name">' + group.l1 + '</span><span class="sum">' + group.items.length + " 条 · " + summary(group.items) + '</span></button>' +
      '<div class="body">' + rows + '</div>';
    mod.querySelector(".head").addEventListener("click", () => {
      const next = !mod.classList.contains("open");
      mod.classList.toggle("open", next);
      mod.querySelector(".chev").textContent = next ? "▾" : "▸";
    });
    list.appendChild(mod);
  }
}

function onToolClick(event) {
  const btn = event.target.closest("button");
  if (!btn) return;
  if (btn.dataset.kind === "view") view = btn.dataset.value;
  else fold = btn.dataset.value;
  render();
}
document.getElementById("tools").addEventListener("click", onToolClick);

render();
</script>
</body>
